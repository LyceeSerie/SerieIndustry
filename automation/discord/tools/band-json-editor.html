ckground:#fff;color:inherit}textarea{min-height:96px;resize:vertical}.checks{display:flex;gap:6px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:6px;border:1px solid #d8e0eb;border-radius:5px;font-size:12px;padding:6px 9px}.checks label:has(input:checked){background:#eaf0fc;border-color:#2457b5}.other{margin-top:8px}details summary{cursor:pointer;font-weight:bold;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:330px;overflow:auto;background:#f5f7fa;padding:12px}#message{white-space:pre-wrap;color:#304a26;font-size:13px}#message.error{color:#b02020}#option-json{min-height:340px;font-family:monospace}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{color:#a32222}.badge{font-size:11px;background:#2457b5;color:#fff;padding:3px 6px;border-radius:3px}.note{border-left:3px solid #c69c28;padding-left:12px}a{color:#2457b5}@media(max-width:760px){header{padding:18px}main{grid-template-columns:1fr;padding:16px;gap:16px}aside{position:static}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}#bands{grid-template-columns:repeat(2,minmax(0,1fr))}}

<header>
  <h1>VRC Band DB <span class="badge">運営登録JSONエディター</span></h1>
  <p class="hint">バンドを入力して「JSONを書き出す」→ Discordの /band-add に添付。最大20件・64KiB。画像はURLで指定します。* はフォームと同じ必須項目です。</p>
  <p class="hint">入力はこのブラウザ内で処理します。自動保存・自動送信はしません。閉じる前にJSONを書き出してください。</p>
  <div class="toolbar">
    <label class="file-label">JSONを読み込む<input id="import" type="file" accept=".json,application/json"></label>
    <button id="export" class="primary">JSONを書き出す</button>
    <button id="copy">JSONをコピー</button>
    <button id="options-toggle">選択肢を設定</button>

      <label for="option-json">各項目の候補（JSON）</label><textarea id="option-json" spellcheck="false"></textarea>

</main>

<script id="editor-core">
(() => {
  const fields = ['活動名','活動名（よみがな）※ひらがなで入力','活動名（英語）','活動形態１','活動形態２','活動形態３','活動プラットフォーム','メインジャンル','サブジャンル','属性','募集パート','ロゴ','アイコン','アー写','ロゴ配置位置','SNSリンク（X/Twitter）','SNSリンク（Youtube）','VRC Groupリンク','その他SNSリンク1','その他SNSリンク2','その他SNSリンク3','その他SNSリンク4','その他SNSリンク5','コメント','活動時間帯','バンドメンバー','YouTube動画URL'];
  const defaults = {
    '活動形態１':['バンド','ユニット','弾き語り','歌','楽器ソロ'],
    '活動形態２':['オリジナル','カバー'],
    '活動形態３':['活動中','解散/活動停止中（休止）'],
    '活動プラットフォーム':['VRChat','Cluster','音源/動画'],
    'メインジャンル':['ポップ','ロック','メタル','パンク','ジャズ／フュージョン','ブルース','R&B／ソウル／ファンク','ヒップホップ／ラップ','エレクトロニック／ダンス','フォーク／カントリー','クラシック','アニメ／電波','インダストリアル／無調／ノイズ'],
    '属性':['女性ボーカル','男性ボーカル','インスト'],
    '募集パート':['ボーカル（男性）','ボーカル（女性）','リズムギター','リードギター','ベース','ドラム','シンセ'],
    'ロゴ配置位置':['アー写に重ねない','アー写に重ねる 左上','アー写に重ねる 左下','アー写に重ねる 右上','アー写に重ねる 右下']
  };
  const required=['活動名','活動形態１','活動形態２','活動形態３','活動プラットフォーム','メインジャンル','アイコン','アー写','SNSリンク（X/Twitter）','コメント','活動時間帯'];
  const otherAllowed=['属性','募集パート'];
  const multiple = ['活動プラットフォーム','メインジャンル','属性','募集パート'];
  function blank() { return Object.fromEntries(fields.map(key => [key,''])); }
  function videoId(value) {
    const match=/^https:\/\/(?:www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com)\/([^\s<>"'\\]*)$/i.exec(value.trim());
    if(!match)return '';const path=match[2];let id='';
    if(match[1].toLowerCase()==='youtu.be')id=path.split(/[?#]/)[0];
    else if(/^watch\?/.test(path)){const q=/(?:\?|&)v=([A-Za-z0-9_-]{11})(?:&|#|$)/.exec(path);id=q?q[1]:'';}
    else{const q=/^(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})(?:[?#]|$)/.exec(path);id=q?q[1]:'';}
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:'';
  }
  function parseImport(text) {
    if(new TextEncoder().encode(text).length>65536)throw Error('64KiBを超えています。');
    const data=JSON.parse(text.replace(/^\uFEFF/,''));
    if(!Array.isArray(data)||!data.length||data.length>20)throw Error('1〜20件のバンドをJSON配列で指定してください。');
    return data.map((band,index)=>{
      if(!band||typeof band!=='object'||Array.isArray(band))throw Error(`${index+1}件目がオブジェクトではありません。`);
      for(const key of Object.keys(band))if(!fields.includes(key)||typeof band[key]!=='string')throw Error(`${index+1}件目：項目「${key}」は未対応、または値が文字列ではありません。`);
      memberRows(band['バンドメンバー']||'');
      return {...blank(),...band};
    });
  }
  function memberRows(value) {
    return String(value || '').split(/\r?\n/).filter(line=>line.trim()).map((line,index)=>{
      const cells=line.split(/[|｜]/).map(value=>value.trim());
      if(cells.length<2||cells.length>3)throw Error(`メンバー${index+1}：既存データの形式を確認してください。`);
      return {part:cells[0],name:cells[1],account:cells[2]||''};
    });
  }
  function memberText(rows) {
    return rows.filter(row=>row.part.trim()||row.name.trim()||row.account.trim()).map((row,index)=>{
      if(!row.name.trim())throw Error(`メンバー${index+1}：名前を入力してください。`);
      if([row.part,row.name,row.account].some(value=>/[|｜\r\n]/.test(value)))throw Error(`メンバー${index+1}：入力欄に縦棒や改行は使えません。`);
      return (row.account.trim()?[row.part,row.name,row.account]:[row.part,row.name]).map(value=>value.trim()).join(' | ');
    }).join('\n');
  }
  function tagItems(value,key) {
    const pattern=['メインジャンル','活動プラットフォーム'].includes(key)?/[,，、\n]+/:/[,，、。\s/／]+/u;
    return [...new Set(String(value||'').split(pattern).map(value=>value.trim()).map(value=>key==='活動プラットフォーム'&&value==='音源/動画のみ'?'音源/動画':value).filter(Boolean))];
  }
  function tagText(items) { return [...new Set(items.map(value=>value.trim()).filter(Boolean))].join(', '); }
  function output(bands) {
    if(!bands.length||bands.length>20)throw Error('1〜20件で登録してください。');
    const normalized=bands.map((band,index)=>{
      const full=blank();for(const key of fields){const value=String(band[key]||'').trim();if(value.length>4000||/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/.test(value))throw Error(`${index+1}件目：${key}の文字数・制御文字を確認してください。`);full[key]=value;}
      for(const key of [...multiple,'サブジャンル'])full[key]=tagText(tagItems(full[key],key));
      try { full['バンドメンバー']=memberText(memberRows(full['バンドメンバー'])); } catch(error) { throw Error(`${index+1}件目：${error.message}`); }
      for(const key of required)if(!full[key])throw Error(`${index+1}件目：${key}は必須です。`);
      if(full['YouTube動画URL']&&!videoId(full['YouTube動画URL']))throw Error(`${index+1}件目：YouTube動画URLを確認してください。`);
      for(const key of ['ロゴ','アイコン','アー写'])if(full[key]){let url;try{url=new URL(full[key]);}catch{}if(!url||!['https:','http:'].includes(url.protocol)||url.username||url.password)throw Error(`${index+1}件目：${key}はhttp/httpsのURLにしてください。`);}
      if(JSON.stringify(full).length>12000)throw Error(`${index+1}件目：全体が12000文字を超えています。`);
      return Object.fromEntries(Object.entries(full).filter(([,value])=>value!==''));
    });
    const text=JSON.stringify(normalized,null,2)+'\n';if(new TextEncoder().encode(text).length>65536)throw Error('全体が64KiBを超えています。バンドを分けて書き出してください。');return text;
  }
  function validateOptions(value){if(!value||typeof value!=='object'||Array.isArray(value)||Object.keys(value).some(key=>!Object.hasOwn(defaults,key)))throw Error('選択肢の項目名を確認してください。');const result={...defaults};for(const [key,items]of Object.entries(value)){if(!Array.isArray(items)||items.some(item=>typeof item!=='string'||!item.trim()||item.length>200||item.includes(','))||new Set(items).size!==items.length)throw Error(`${key}は重複・空欄・カンマを含まない文字列配列にしてください。`);result[key]=items;}return result;}
  globalThis.BandEditor={fields,defaults,multiple,required,otherAllowed,blank,videoId,parseImport,output,validateOptions,memberRows,memberText,tagItems,tagText};
})();
</script>
<script>
(() => {
  const portal=window.VBD_PORTAL===true,metadata=new WeakMap(),pendingUploads=new WeakMap(),dirtyBands=new WeakSet();let csrf='',imageLimits={},busy=0,portalAdmin=false;
  const bandLimit=()=>portal?(portalAdmin?Infinity:10):20;
  function portalPresentation(role){
    portalAdmin=role==='admin';
    const title=portalAdmin?'バンド管理':'バンド登録・編集';
    document.title='VRC Band DB｜'+title;document.querySelector('h1').textContent='VRC Band DB｜'+title;
    const notes=document.querySelectorAll('header .hint');
    notes[0].textContent=portalAdmin?'管理用：登録済みバンドの確認・編集と、運営による新規登録ができます。変更は承認後に公開されます。':'自分のバンドを登録・編集できます。変更は承認後に公開されます。';
    notes[1].textContent='* は必須項目です。PNG画像を選択できます。入力後に「'+(portalAdmin?'変更を保存':'登録・変更を保存')+'」を押してください。';
    if($('portal-save'))$('portal-save').textContent=portalAdmin?'変更を保存':'登録・変更を保存';
    document.body.dataset.mode=portalAdmin?'admin':'user';
    if($('portal-mode'))$('portal-mode').textContent=portalAdmin?'管理用':'通常用';
  }
  const C=BandEditor,$=id=>document.getElementById(id);let bands=[C.blank()],active=0,choices=structuredClone(C.defaults),dirty=false;
  const names={'活動形態１':'活動形態１（活動形態）','活動形態２':'活動形態２（演奏区分）','活動形態３':'活動形態３（活動状態）','活動名（よみがな）※ひらがなで入力':'活動名（よみがな）','ロゴ':'ロゴ（1024×512px程度）','アイコン':'アイコン（256×256px程度）','アー写':'アー写（3840×2160px上限目安）','ロゴ配置位置':'ロゴ配置位置（デフォルトは重ねない）','募集パート':'募集パート（未選択でなし）','YouTube動画URL':'Youtube 動画 URL'};
  const sections=[['活動情報',C.fields.slice(0,10)],['画像・ロゴ配置',['ロゴ','ロゴ配置位置','アイコン','アー写']],['メンバー・募集',['バンドメンバー','募集パート']],['動画',['YouTube動画URL']],['SNS・リンク',C.fields.slice(15,23)],['紹介',['コメント','活動時間帯']]];
  function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
  function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error);}
  function changed(){dirty=true;dirtyBands.add(bands[active]);list();preview();}
  function list(){const list=$('bands');list.replaceChildren();$('count').textContent=`${portal?(portalAdmin?'登録済みバンド':'自分のバンド'):'バンド一覧'}（${bands.length}${Number.isFinite(bandLimit())?'/'+bandLimit():''}）`;$('add').disabled=$('duplicate').disabled=bands.length>=bandLimit();$('delete').disabled=bands.length<=1;bands.forEach((band,index)=>{const item=el('li'),button=el('button',`${index+1}. ${band['活動名']||'未入力'}`);button.type='button';button.setAttribute('aria-current',String(index===active));button.onclick=()=>{active=index;render();};item.append(button);list.append(item);});}
  function preview(){try{$('preview').textContent=C.output(bands);}catch(error){$('preview').textContent=error.message;}}
  function set(key,value){bands[active][key]=value;changed();}
  function itemInputs(values,title,onchange,allowAdd=true) {
    const container=el('div',undefined,'item-editor'),list=el('div',undefined,'item-list'),add=el('button',`＋ ${title}を追加`);add.type='button';
    const rows=[...values];
    function sync(){onchange(rows);}
    function draw(){list.replaceChildren();rows.forEach((value,index)=>{
      const row=el('div',undefined,'item-row'),label=el('label',`${title} ${index+1}`),input=el('input'),remove=el('button','削除','danger');input.type='text';input.value=value;input.maxLength=4000;input.placeholder='1件ずつ入力';input.oninput=()=>{rows[index]=input.value;sync();};label.append(input);remove.type='button';remove.setAttribute('aria-label',`${title}${index+1}を削除`);remove.onclick=()=>{rows.splice(index,1);sync();draw();};row.append(label,remove);list.append(row);
    });}
    add.onclick=()=>{rows.push('');draw();list.lastElementChild?.querySelector('input')?.focus();};draw();container.append(list);if(allowAdd)container.append(add);return container;
  }
  function field(key,index){const wrap=el('div',undefined,'field'),label=el('label',(names[key]||key)+(C.required.includes(key)?' *':'')),id=`field-${index}`;label.htmlFor=id;wrap.append(label);const value=bands[active][key];
    if(key==='バンドメンバー'){
      wrap.classList.add('wide');label.removeAttribute('for');const rows=C.memberRows(value),list=el('div',undefined,'member-rows'),add=el('button','＋ メンバー追加');add.type='button';
      const sync=()=>set(key,rows.filter(row=>row.part.trim()||row.name.trim()||row.account.trim()).map(row=>[row.part,row.name,row.account].join(' | ')).join('\n'));
      function draw(){list.replaceChildren();rows.forEach((row,rowIndex)=>{
        const item=el('fieldset',undefined,'member-row'),legend=el('legend',`メンバー ${rowIndex+1}`);item.append(legend);
        for(const [property,title,placeholder]of [['part','パート','例：ボーカル / ギター'],['name','名前（必須）','例：芹井'],['account','XのID・プロフィールURL（任意）','例：zerry_furai']]){
          const cell=el('label',title),input=el('input');input.type='text';input.value=row[property];input.placeholder=placeholder;input.maxLength=1000;input.setAttribute('aria-label',`メンバー${rowIndex+1} ${title}`);input.oninput=()=>{row[property]=input.value;sync();};cell.append(input);item.append(cell);
        }
        const remove=el('button','削除','danger');remove.type='button';remove.setAttribute('aria-label',`メンバー${rowIndex+1}を削除`);remove.onclick=()=>{rows.splice(rowIndex,1);sync();draw();};item.append(remove);list.append(item);
      });}
      add.onclick=()=>{rows.push({part:'',name:'',account:''});draw();list.lastElementChild?.querySelector('input')?.focus();};draw();wrap.append(list,add);
    }else if(choices[key]&&C.multiple.includes(key)){
      const known=choices[key],selected=C.tagItems(value,key),checks=el('div',undefined,'checks'),boxes=[];checks.id=id;checks.setAttribute('role','group');checks.setAttribute('aria-label',names[key]||key);label.removeAttribute('for');
      for(const option of known){const optionLabel=el('label'),input=el('input');input.type='checkbox';input.value=option;input.checked=selected.includes(option);optionLabel.append(input,document.createTextNode(option));checks.append(optionLabel);boxes.push(input);}
      let others=selected.filter(v=>!known.includes(v));
      const update=()=>set(key,C.tagText([...boxes.filter(input=>input.checked).map(input=>input.value),...others]));
      const other=itemInputs(others,`${names[key]||key} ${C.otherAllowed.includes(key)?'その他':'既存の候補外値'}`,values=>{others=values;update();},C.otherAllowed.includes(key));boxes.forEach(input=>input.onchange=update);wrap.append(checks);if(C.otherAllowed.includes(key)||others.length)wrap.append(other);
    }else if(key==='サブジャンル'){
      label.removeAttribute('for');wrap.append(itemInputs(C.tagItems(value,key),'サブジャンル',values=>set(key,C.tagText(values))));
    }else if(choices[key]){
      const select=el('select');select.id=id;select.required=C.required.includes(key);select.append(new Option('未設定',''));choices[key].forEach(option=>select.append(new Option(option,option)));
      if(value&&!choices[key].includes(value))select.append(new Option(`${value}（既存値・候補外）`,value));
      select.value=value;select.onchange=()=>set(key,select.value);wrap.append(select);
    }else{
      const multiline=['コメント','バンドメンバー'].includes(key),input=el(multiline?'textarea':'input');input.id=id;if(!multiline)input.type='text';input.value=value;input.maxLength=4000;if(C.required.includes(key))input.required=true;if(multiline)wrap.classList.add('wide');input.oninput=()=>set(key,input.value);wrap.append(input);
    }
    if(portal&&['ロゴ','アイコン','アー写'].includes(key)) {
      const fileLabel=el('label','PNG画像をアップロード','file-label'),fileInput=el('input');fileInput.type='file';fileInput.accept='image/png';fileInput.disabled=busy>0;fileInput.setAttribute('aria-label',key+'の画像をアップロード');
      const target=bands[active];fileInput.onchange=async()=>{const file=fileInput.files[0];if(!file)return;try{await uploadImage(target,key,file);}catch(error){message(error.message,true);}finally{fileInput.value='';}};
      fileLabel.append(fileInput);wrap.append(fileLabel);
      const limit=imageLimits[key];if(limit)wrap.append(el('p',`PNGのみ・${limit.width}×${limit.height}px以内・${limit.bytes/1048576}MiB以内`,'hint'));
    }
    const hints={'活動名（よみがな）※ひらがなで入力':'ひらがなで入力。','サブジャンル':'＋ボタンで1件ずつ追加します。カンマ区切りは書き出し時に自動変換します。','活動プラットフォーム':'複数選択可。「音源/動画のみ」は1項目です。','メインジャンル':'複数選択可。細かいジャンルはサブジャンルへ入力してください。','募集パート':'未選択は募集なし。','YouTube動画URL':'紹介動画1件のURL。チャンネルリンク・iframeコードは使えません。','バンドメンバー':'「メンバー追加」で1人ずつ入力します。名前は必須、パートとXは省略可能です。JSONの区切りは書き出し時に自動で付けます。','ロゴ':'画像のURL。1024×512px程度。','アイコン':'PNG画像のURL。256×256以内。','アー写':'PNG画像のURL。3840×2160以内。','ロゴ配置位置':'未設定時はアー写に重ねません。','SNSリンク（X/Twitter）':'@xxx形式。ない場合は代表者のXアカウントを入力してください。例：@zerry_furai','SNSリンク（Youtube）':'@xxx形式。例：@LyceeSerie','VRC Groupリンク':'URL形式。例：https://vrc.group/xxxx.0000','その他SNSリンク1':'タイトル:リンクの形式。例：HP:https://example.com','その他SNSリンク2':'タイトル:リンクの形式で入力してください。','その他SNSリンク3':'タイトル:リンクの形式で入力してください。','その他SNSリンク4':'タイトル:リンクの形式で入力してください。','その他SNSリンク5':'タイトル:リンクの形式で入力してください。'};
    if(portal){hints['サブジャンル']='＋ボタンで1件ずつ追加してください。';hints['バンドメンバー']='1人ずつ追加してください。名前は必須、パートとXは省略可能です。';}
    if(hints[key])wrap.append(el('p',hints[key],'hint'));return wrap;
  }
  function render(){list();$('editor-heading').textContent=portal?`${bands[active]['活動名']||'新規バンド'}${metadata.get(bands[active])?.id?' の編集':' の登録'}`:`${active+1}件目のバンド`;const editor=$('editor');editor.replaceChildren();let index=0;for(const [title,keys]of sections){const group=el('fieldset'),legend=el('legend',title),grid=el('div',undefined,'grid');for(const key of keys)grid.append(field(key,index++));group.append(legend,grid);editor.append(group);}preview();if(portal)setBusy(0);}
  function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function attempt(fn){try{fn();}catch(error){message(error.message,true);}}
  $('editor').onsubmit=e=>e.preventDefault();
  $('add').onclick=()=>{if(bands.length<bandLimit()){bands.push(C.blank());active=bands.length-1;dirty=true;render();}};
  $('duplicate').onclick=()=>{if(bands.length<bandLimit()){bands.push({...bands[active]});active=bands.length-1;dirty=true;render();}};
  $('delete').onclick=()=>{if(bands.length>1&&confirm('このバンドを編集中の一覧から削除しますか？')){bands.splice(active,1);active=Math.min(active,bands.length-1);dirty=true;render();}};
  $('export').onclick=()=>attempt(()=>{const text=C.output(bands);download(text,'追加バンド.json');dirty=false;message(`${bands.length}件を書き出しました。Discordの /band-add に添付してください。`);});
  $('copy').onclick=async()=>{try{const text=C.output(bands);await navigator.clipboard.writeText(text);message('JSONをコピーしました。');}catch(error){message('コピーできませんでした。JSONを書き出すか、プレビューからコピーしてください。\n'+error.message,true);}};
  $('import').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>65536)throw Error('64KiB以内のJSONを選んでください。');const imported=C.parseImport(await file.text());if(dirty&&!confirm('編集中の内容を読み込んだJSONで置き換えますか？'))return;bands=imported;active=0;dirty=false;render();message(`${bands.length}件を読み込みました。`);}catch(error){message('読み込み失敗：'+error.message,true);}finally{event.target.value='';}};
  $('options-toggle').onclick=()=>{$('options-panel').hidden=!$('options-panel').hidden;if(!$('options-panel').hidden)$('option-json').value=JSON.stringify(choices,null,2);};
  $('options-apply').onclick=()=>attempt(()=>{choices=C.validateOptions(JSON.parse($('option-json').value));render();message('選択肢を更新しました。入力済みの候補外の値は「その他」に保持しています。');});
  $('options-export').onclick=()=>attempt(()=>download(JSON.stringify(C.validateOptions(JSON.parse($('option-json').value)),null,2),'バンド選択肢設定.json'));
  $('options-import').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>65536)throw Error('設定ファイルが大きすぎます。');choices=C.validateOptions(JSON.parse(await file.text()));$('option-json').value=JSON.stringify(choices,null,2);render();message('選択肢設定を読み込みました。');}catch(error){message(error.message,true);}finally{event.target.value='';}};
  function setBusy(delta){busy+=delta;const save=$('portal-save');if(save)save.disabled=busy>0;document.querySelectorAll('#editor input,#editor textarea,#editor select').forEach(input=>input.disabled=busy>0);}
  async function api(path,body){
    if(window.VBD_PREVIEW_API && ['127.0.0.1','localhost','[::1]'].includes(location.hostname))return window.VBD_PREVIEW_API(path,body);
    let response;try{response=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:body===undefined?{}:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});}catch{throw Error('通信できませんでした。入力を残したまま再試行してください。');}
    const data=await response.json();if(!response.ok||!data.ok){const messages={LOGIN_REQUIRED:'ログインし直してください。',PORTAL_CONSENT_REQUIRED:'登録時の同意事項をご確認ください。画面を再読み込みして同意後に進んでください。', PORTAL_SESSION_EXPIRED:'ログイン期限が切れました。別タブでログインし直してから、入力を保存してください。',STALE_EDIT:'別の編集が保存されています。入力を控えたうえで画面を再読み込みし、最新の内容を確認してください。',PORTAL_FORBIDDEN:'このバンドを編集する権限がありません。',UPLOAD_DAILY_LIMIT:'本日の画像送信上限です。',UPLOAD_PENDING:'画像の保存結果を確認中です。運営へ連絡してください。',UPLOAD_CONFIGURATION:'運営側の画像保存先が未設定です。',INVALID_PNG:'有効なPNG画像を選んでください。',INVALID_IMAGE:'画像の容量・寸法を確認してください。',REGISTRATION_DELETED:'この登録は削除されています。運営へお問い合わせください。'};throw Error(messages[data.code]||'保存できませんでした：'+String(data.code||'REQUEST_FAILED'));}return data;
  }
  async function uploadImage(target,field,file){
    const limit=imageLimits[field];if(!limit||file.type!=='image/png'||file.size<1||file.size>limit.bytes)throw Error('PNG画像の種類・容量を確認してください。');
    const bitmap=await createImageBitmap(file);const dimensionsOk=bitmap.width<=limit.width&&bitmap.height<=limit.height;bitmap.close();if(!dimensionsOk)throw Error('画像の寸法が上限を超えています。');
    setBusy(1);message(field+'を送信しています…');
    try{
      const sha256=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()))].map(value=>value.toString(16).padStart(2,'0')).join('');
      const pending=pendingUploads.get(target)||{};pendingUploads.set(target,pending);if(pending[field]?.sha256!==sha256)pending[field]={sha256,id:crypto.randomUUID()};
      const {ticket}=await api('/api/upload-ticket',{field,bytes:file.size,sha256,uploadId:pending[field].id});
      const dataBase64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('画像を読み込めませんでした。'));reader.readAsDataURL(file);});
      const saved=await api('/api/upload',{uploadTicket:ticket,dataBase64});target[field]=saved.url;dirty=true;dirtyBands.add(target);delete pending[field];
      if(target===bands[active])render();else list();message(field+'を保存しました。バンド情報の保存も行ってください。');
    }finally{setBusy(-1);}
  }
  async function savePortal(){
    setBusy(1);message('保存しています…');
    try{
      const target=bands[active],band=window.VBD_PREVIEW_OUTPUT&&['127.0.0.1','localhost','[::1]'].includes(location.hostname)?window.VBD_PREVIEW_OUTPUT(C,target):JSON.parse(C.output([target]))[0],hash=JSON.stringify(band),meta=metadata.get(target)||{};
      if(meta.hash!==hash){meta.hash=hash;meta.submissionId=crypto.randomUUID();}metadata.set(target,meta);
      const saved=await api('/api/save',{registrationId:meta.id,revision:meta.revision,submissionId:meta.submissionId,band});
      meta.id=saved.id;meta.revision=saved.revision;meta.status=saved.status;dirtyBands.delete(target);dirty=bands.some(band=>dirtyBands.has(band));render();
      message('保存しました。現在は'+(saved.status==='approved'?'承認済み':'承認待ち')+'です。通知が届かない場合も保存結果は保持されています。');
    }catch(error){message(error.message,true);}finally{setBusy(-1);}
  }
  async function loadPortal(){
    try{
      const data=await api('/api/me');csrf=data.csrf;imageLimits=data.limits;portalPresentation(data.role);
      if(data.consentRequired){showConsent(data.termsVersion);return;}
      $('portal-consent')?.remove();document.querySelector('main').hidden=false;$('portal-save').hidden=false;
      bands=data.records.length?data.records.map(record=>{const band={...C.blank(),...record.band};metadata.set(band,{id:record.id,revision:record.revision,status:record.status});return band;}):[C.blank()];
      render();message(portalAdmin?'登録済みバンドを表示しています。新規登録には「＋ バンド追加」を押してください。':'自分のバンドを表示しています。既存バンドが表示されない場合は運営へ紐付けを依頼してください。');
    }catch(error){message(error.message,true);}
  }
  function showConsent(version){
    document.querySelector('main').hidden=true;$('portal-save').hidden=true;
    $('portal-consent')?.remove();
    const terms=JSON.parse($('registration-terms').textContent),section=el('section',undefined,'card');section.id='portal-consent';
    section.style.cssText='max-width:900px;margin:24px auto;padding:28px;line-height:1.9';
    section.setAttribute('aria-labelledby','consent-title');
    const title=el('h2',terms.title);title.id='consent-title';section.append(title,el('p',terms.introduction));
    const clauses=el('ol');for(const clause of terms.clauses){const item=el('li',clause);item.style.marginBottom='16px';clauses.append(item);}section.append(clauses);
    const label=el('label'),checkbox=el('input');checkbox.type='checkbox';checkbox.id='consent-accepted';label.append(checkbox,document.createTextNode(' 上記の内容を確認し、誓約・同意します。'));section.append(label);
    const proceed=el('button','同意して登録画面へ進む','primary');proceed.type='button';proceed.disabled=true;proceed.style.cssText='display:block;margin-top:20px';
    checkbox.onchange=()=>{proceed.disabled=!checkbox.checked;};
    proceed.onclick=async()=>{if(!checkbox.checked)return;proceed.disabled=true;checkbox.disabled=true;try{if(version!==terms.version)throw Error('同意事項が更新されています。画面を再読み込みしてください。');await api('/api/consent',{accepted:true,version:terms.version});await loadPortal();}catch(error){message(error.message,true);proceed.disabled=false;checkbox.disabled=false;}};
    section.append(proceed);document.querySelector('main').before(section);message('初回登録の前に、同意事項をご確認ください。');
  }
  if(portal){
    document.querySelector('main').hidden=true;
    document.body.classList.add('portal');
    Object.assign(names,{'活動形態１':'活動形態','活動形態２':'演奏区分','活動形態３':'活動状態'});
    const modeBadge=el('span','通常用','portal-mode');modeBadge.id='portal-mode';document.querySelector('h1').after(modeBadge);
    document.title='VRC Band DB｜バンド登録・編集';document.querySelector('h1').textContent='VRC Band DB｜バンド登録・編集';
    const notes=document.querySelectorAll('header .hint');notes[0].textContent='自分のバンドを登録・編集できます。保存した変更は承認後に公開されます。* は必須項目です。';notes[1].textContent='画像はPNGをアップロードできます。ページを閉じる前に保存してください。';
    for(const id of ['import','export','copy','options-toggle','duplicate','delete']){const control=$(id);(control.closest('label')||control).hidden=true;}
    document.querySelector('article>details').hidden=true;
    const save=el('button','登録・変更を保存','primary');save.id='portal-save';save.hidden=true;save.onclick=savePortal;
    const logout=el('button','ログアウト');logout.onclick=async()=>{if(dirty&&!confirm('未保存の入力があります。ログアウトしますか？'))return;try{await api('/api/logout',{});dirty=false;location.href='/auth/logged-out';}catch(error){message(error.message,true);}};
    document.querySelector('.toolbar').append(save,logout);portalPresentation('user');void loadPortal();
  }
  window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});render();
})();
</script>
