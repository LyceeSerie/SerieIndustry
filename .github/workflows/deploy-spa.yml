name: Deploy Vue SPA to deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: serieindustry-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: SI-HP
        run: npm ci

      - name: Test data conversion and search
        working-directory: SI-HP
        run: npm test

      - name: Build Vue app
        working-directory: SI-HP
        env:
          VRC_BAND_DB_APPROVED_SHEET_URL: ${{ vars.VRC_BAND_DB_APPROVED_SHEET_URL }}
          VRC_BAND_DB_REQUIRE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && 'true' || vars.VRC_BAND_DB_REQUIRE_APPROVED }}
        run: npm run build

      - name: Prepare deploy files
        run: |
          mkdir deploy_temp
          cp -r SI-HP/dist/* deploy_temp/
          cp -r tou deploy_temp/tou
          # Keep published VPM versions when the SPA replaces the deploy branch.
          if git cat-file -e origin/deploy:vpm/index.json 2>/dev/null; then
            mkdir -p deploy_temp/vpm
            git show origin/deploy:vpm/index.json > deploy_temp/vpm/index.json
          fi
          echo "serieindustry.com" > deploy_temp/CNAME

      - name: Deploy to deploy branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan deploy
          git rm -rf . || true
          cp -r deploy_temp/* .
          git add .
          git diff --cached --quiet || git commit -m "Deploy SPA"

          git push origin deploy --force

